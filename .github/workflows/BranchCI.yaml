name: BranchCI

on:
  workflow_call:
    inputs:
      src:
        description: The folder containing the source code
        type: string
        required: true
      test_dir:
        description: The folder containing the tests
        type: string
        required: false
        default: tests

jobs:
  light-ci:
    name: Lint & Docs ubuntu-latest Py3.12
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Additional info about the build
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a
    # Two environment paths, chosen by whether the package still ships a
    # conda CI environment file. Packages without one are installed with uv
    # WITH their dependencies, so install_requires is what gets tested.
    #
    # --- conda path (legacy) ---------------------------------------------
    - uses: conda-incubator/setup-miniconda@v4
      if: hashFiles('devtools/conda-envs/test_env.yaml') != ''
      with:
        python-version: "3.12"
        environment-file: devtools/conda-envs/test_env.yaml
        activate-environment: test
        auto-update-conda: false
        auto-activate-base: false
        show-channel-urls: true
    - name: Install package (conda)
      if: hashFiles('devtools/conda-envs/test_env.yaml') != ''
      # conda setup requires this special shell
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps
        conda list
    # --- uv path -----------------------------------------------------------
    # The interpreter comes from actions/setup-python: its toolcache builds
    # include tkinter on every runner, which the system and standalone
    # Pythons do not. uv is only the installer.
    - uses: actions/setup-python@v6
      if: hashFiles('devtools/conda-envs/test_env.yaml') == ''
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      if: hashFiles('devtools/conda-envs/test_env.yaml') == ''
      with:
        enable-cache: true
    - name: Install package (uv)
      if: hashFiles('devtools/conda-envs/test_env.yaml') == ''
      shell: bash
      run: |
        uv venv --seed --python "$(which python)" .venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        uv pip install '.[test,docs]' pytest pytest-cov black flake8 codecov pydata-sphinx-theme sphinx-design sphinx-copybutton sphinxnotes-strike sphinx-rtd-theme rinohtype pystemmer pygments
        uv pip list
    - name: Run linters
      shell: bash -l {0}
      run: |
        make lint
    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest -v --doctest-modules --cov=${{ inputs.src }} --cov-report=term --color=yes ${{inputs.test_dir }}
    - name: Test documentation
      shell: bash -l {0}
      run: |
        make html
