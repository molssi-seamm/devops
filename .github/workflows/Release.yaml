name: Release

on:
  workflow_call:
    inputs:
      src:
        description: The folder containing the source code
        type: string
        required: true
      test_dir:
        description: The folder containing the tests
        type: string
        required: false
        default: tests
      python-versions:
        description: >-
          JSON list of the Python versions to test, e.g. '["3.12"]' for a
          package whose python_requires excludes 3.11.
        type: string
        required: false
        default: '["3.11", "3.12"]'

jobs:
  lint-docs:
    name: Lint & Docs ubuntu-latest Py3.12
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Additional info about the build
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a
    # Two environment paths, chosen by whether the package still ships a
    # conda CI environment file. Packages without one are installed with uv
    # WITH their dependencies, so install_requires is what gets tested.
    #
    # --- conda path (legacy) ---------------------------------------------
    - uses: conda-incubator/setup-miniconda@v4
      if: hashFiles('devtools/conda-envs/test_env.yaml') != ''
      with:
        python-version: "3.12"
        environment-file: devtools/conda-envs/test_env.yaml
        activate-environment: test
        auto-update-conda: false
        auto-activate-base: false
        show-channel-urls: true
    - name: Install package (conda)
      if: hashFiles('devtools/conda-envs/test_env.yaml') != ''
      # conda setup requires this special shell
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps
        conda list
    # --- uv path -----------------------------------------------------------
    # The interpreter comes from actions/setup-python: its toolcache builds
    # include tkinter on every runner, which the system and standalone
    # Pythons do not. uv is only the installer.
    - uses: actions/setup-python@v6
      if: hashFiles('devtools/conda-envs/test_env.yaml') == ''
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      if: hashFiles('devtools/conda-envs/test_env.yaml') == ''
      with:
        enable-cache: true
    - name: Install package (uv)
      if: hashFiles('devtools/conda-envs/test_env.yaml') == ''
      shell: bash
      run: |
        uv venv --seed --python "$(which python)" .venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        uv pip install '.[test,docs]' pytest pytest-cov black flake8 codecov pydata-sphinx-theme sphinx-design sphinx-copybutton sphinxnotes-strike sphinx-rtd-theme rinohtype pystemmer pygments
        uv pip list
    - name: Run linters
      shell: bash -l {0}
      run: |
        make lint
    - name: Documentation
      shell: bash -l {0}
      run: |
        make html
    - name: Deploy documentation
      uses: peaceiris/actions-gh-pages@v4
      # if: github.ref == 'refs/heads/main'
      # Never block the PyPI publish: the package's own Docs workflow pushes
      # gh-pages for the merge to main (and make update's push to dev) at the
      # same moment, and a rejected push here used to skip PyPI
      # (properties_step 2026.10.5, twice). Those pushes publish the docs anyway.
      continue-on-error: true
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html

  test:
    name: Test ${{ matrix.os }} Py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint-docs
    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest]
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
    - uses: actions/checkout@v5
    - name: Additional info about the build
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a
    # Two environment paths, chosen by whether the package still ships a
    # conda CI environment file. Packages without one are installed with uv
    # WITH their dependencies, so install_requires is what gets tested.
    #
    # --- conda path (legacy) ---------------------------------------------
    - uses: conda-incubator/setup-miniconda@v4
      if: hashFiles('devtools/conda-envs/test_env.yaml') != ''
      with:
        python-version: ${{ matrix.python-version }}
        environment-file: devtools/conda-envs/test_env.yaml
        activate-environment: test
        auto-update-conda: false
        auto-activate-base: false
        show-channel-urls: true
    - name: Install package (conda)
      if: hashFiles('devtools/conda-envs/test_env.yaml') != ''
      # conda setup requires this special shell
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps
        conda list
    # --- uv path -----------------------------------------------------------
    # The interpreter comes from actions/setup-python: its toolcache builds
    # include tkinter on every runner, which the system and standalone
    # Pythons do not. uv is only the installer.
    - uses: actions/setup-python@v6
      if: hashFiles('devtools/conda-envs/test_env.yaml') == ''
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@v6
      if: hashFiles('devtools/conda-envs/test_env.yaml') == ''
      with:
        enable-cache: true
    - name: Install package (uv)
      if: hashFiles('devtools/conda-envs/test_env.yaml') == ''
      shell: bash
      run: |
        uv venv --seed --python "$(which python)" .venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        uv pip install '.[test,docs]' pytest pytest-cov black flake8 codecov pydata-sphinx-theme sphinx-design sphinx-copybutton sphinxnotes-strike sphinx-rtd-theme rinohtype pystemmer pygments
        uv pip list
    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest -v --doctest-modules --cov=${{ inputs.src }} --cov-report=xml --color=yes ${{ inputs.test_dir }}
    - name: CodeCov
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

  deploy:
    name: PyPi ubuntu-latest Py3.12
    # Run only for tagged releases: development versions and release candidates
    # go only to test.pypi, other releases only to the main pypi (a test.pypi
    # outage must not block a release; the same files go to both, and twine check
    # runs before every release).
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [lint-docs, test]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python "3.12"
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps
        python -m pip list
    - name: Install pypa/build
      run: |
        python -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: |
        python -m build --sdist --wheel --outdir dist/
        ls -l dist/
    - name: Publish distribution 📦 to Test PyPI
      if: contains(github.ref, 'dev') || contains(github.ref, 'rc')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.test_pypi_password }}
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
    - name: Publish distribution 📦 to PyPI
      if: contains(github.ref, 'dev') == false && contains(github.ref, 'rc') == false
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.pypi_password }}
